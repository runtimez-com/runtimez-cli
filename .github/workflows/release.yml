name: release

on:
  push:
    tags: ["v*"]
  # A publish can fail after the artifacts are already uploaded (a tap token, a rate limit).
  # Re-running against the existing tag beats minting a version number to paper over it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release from"
        required: true

permissions:
  contents: write
  id-token: write   # cosign keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned: the archive-format syntax differs across 2.x, so a floating "latest"
          # can reject a config that validates locally.
          version: "~> v2.5"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing the Homebrew tap and Scoop bucket needs a token that can write to
          # those repos; the default GITHUB_TOKEN is scoped to this one only.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
